openapi: 3.1.0
info:
  title: PeopleSoft Application Services Framework Accounts Payable Students API
  description: Modern REST API layer introduced in PeopleTools 8.59 that produces fully compliant OpenAPI/Swagger specifications, supports proper HTTP status codes, uniform URLs, and JSON payloads for integration with Oracle Integration Cloud, mobile apps, and microservices.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/asf/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: Students
  description: Student record operations
paths:
  /students:
    get:
      summary: PeopleSoft List Students
      description: Retrieve student records.
      operationId: listStudents
      tags:
      - Students
      security:
      - basicAuth: []
      parameters:
      - name: term
        in: query
        description: Academic term filter
        schema:
          type: string
        example: example_value
      - name: program
        in: query
        description: Academic program filter
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: Successful response with student records
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /students/{studentId}:
    get:
      summary: PeopleSoft Get Student
      description: Retrieve details for a specific student.
      operationId: getStudent
      tags:
      - Students
      security:
      - basicAuth: []
      parameters:
      - name: studentId
        in: path
        required: true
        description: The student identifier
        schema:
          type: string
        example: PS123456
      responses:
        '200':
          description: Student details
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
        '404':
          description: Student not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{hostname}:{port}/psft/oauth/authorize
          tokenUrl: https://{hostname}:{port}/psft/oauth/token
          scopes: {}
externalDocs:
  description: Application Services Framework Documentation
  url: https://docs.oracle.com/cd/E52319_01/infoportal/asf.html
