openapi: 3.2.0
info:
  title: PeopleSoft HCM Employees API
  description: Human Capital Management APIs for employee data, benefits, payroll, workforce administration, and talent management.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/api/hcm/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: Employees
  description: Employee data operations
paths:
  /employees:
    get:
      summary: PeopleSoft List Employees
      description: Retrieve a list of employee records.
      operationId: listEmployees
      tags:
      - Employees
      security:
      - basicAuth: []
      parameters:
      - name: department
        in: query
        description: Filter by department
        schema:
          type: string
        example: example_value
      - name: status
        in: query
        description: Filter by employment status
        schema:
          type: string
          enum:
          - active
          - inactive
          - terminated
          - leave
        example: active
      responses:
        '200':
          description: Successful response with employee list
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /employees/{employeeId}:
    get:
      summary: PeopleSoft Get Employee
      description: Retrieve details for a specific employee.
      operationId: getEmployee
      tags:
      - Employees
      security:
      - basicAuth: []
      parameters:
      - name: employeeId
        in: path
        required: true
        description: The employee identifier
        schema:
          type: string
        example: PS123456
      responses:
        '200':
          description: Employee details
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
        '404':
          description: Employee not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: PeopleSoft HCM Documentation
  url: https://docs.oracle.com/en/applications/peoplesoft/human-capital-management/index.html
