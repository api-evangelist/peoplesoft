openapi: 3.1.0
info:
  title: PeopleSoft Application Services Framework Accounts Payable Pivot Grids API
  description: Modern REST API layer introduced in PeopleTools 8.59 that produces fully compliant OpenAPI/Swagger specifications, supports proper HTTP status codes, uniform URLs, and JSON payloads for integration with Oracle Integration Cloud, mobile apps, and microservices.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/asf/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: Pivot Grids
  description: Pivot grid and dashboard operations
paths:
  /grids:
    get:
      summary: PeopleSoft List Pivot Grids
      description: Retrieve a list of available pivot grid definitions.
      operationId: listPivotGrids
      tags:
      - Pivot Grids
      security:
      - basicAuth: []
      responses:
        '200':
          description: Successful response with pivot grid list
          content:
            application/json:
              schema:
                type: object
                properties:
                  grids:
                    type: array
                    items:
                      type: object
                      properties:
                        gridId:
                          type: string
                        name:
                          type: string
                        dataSource:
                          type: string
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /grids/{gridId}/data:
    get:
      summary: PeopleSoft Get Pivot Grid Data
      description: Retrieve data for a specific pivot grid with optional filters.
      operationId: getPivotGridData
      tags:
      - Pivot Grids
      security:
      - basicAuth: []
      parameters:
      - name: gridId
        in: path
        required: true
        description: The pivot grid identifier
        schema:
          type: string
        example: PS123456
      - name: filters
        in: query
        description: JSON-encoded filter criteria
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: Pivot grid data
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
        '404':
          description: Pivot grid not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{hostname}:{port}/psft/oauth/authorize
          tokenUrl: https://{hostname}:{port}/psft/oauth/token
          scopes: {}
externalDocs:
  description: Application Services Framework Documentation
  url: https://docs.oracle.com/cd/E52319_01/infoportal/asf.html
