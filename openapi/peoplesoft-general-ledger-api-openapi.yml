openapi: 3.1.0
info:
  title: PeopleSoft Application Services Framework Accounts Payable General Ledger API
  description: Modern REST API layer introduced in PeopleTools 8.59 that produces fully compliant OpenAPI/Swagger specifications, supports proper HTTP status codes, uniform URLs, and JSON payloads for integration with Oracle Integration Cloud, mobile apps, and microservices.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/asf/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: General Ledger
  description: General ledger operations
paths:
  /gl/journals:
    get:
      summary: PeopleSoft List Journal Entries
      description: Retrieve general ledger journal entries.
      operationId: listJournalEntries
      tags:
      - General Ledger
      security:
      - basicAuth: []
      parameters:
      - name: businessUnit
        in: query
        description: Business unit filter
        schema:
          type: string
        example: example_value
      - name: fromDate
        in: query
        description: Start date filter
        schema:
          type: string
          format: date
        example: '2026-04-17'
      - name: toDate
        in: query
        description: End date filter
        schema:
          type: string
          format: date
        example: '2026-04-17'
      responses:
        '200':
          description: Successful response with journal entries
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{hostname}:{port}/psft/oauth/authorize
          tokenUrl: https://{hostname}:{port}/psft/oauth/token
          scopes: {}
externalDocs:
  description: Application Services Framework Documentation
  url: https://docs.oracle.com/cd/E52319_01/infoportal/asf.html
