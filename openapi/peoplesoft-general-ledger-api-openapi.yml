openapi: 3.2.0
info:
  title: PeopleSoft Financials General Ledger API
  description: Financial Management APIs for general ledger, accounts payable, accounts receivable, expenses, asset management, and financial reporting.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/api/financials/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: General Ledger
  description: General ledger operations
paths:
  /gl/journals:
    get:
      summary: PeopleSoft List Journal Entries
      description: Retrieve general ledger journal entries.
      operationId: listJournalEntries
      tags:
      - General Ledger
      security:
      - basicAuth: []
      parameters:
      - name: businessUnit
        in: query
        description: Business unit filter
        schema:
          type: string
        example: example_value
      - name: fromDate
        in: query
        description: Start date filter
        schema:
          type: string
          format: date
        example: '2026-04-17'
      - name: toDate
        in: query
        description: End date filter
        schema:
          type: string
          format: date
        example: '2026-04-17'
      responses:
        '200':
          description: Successful response with journal entries
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: PeopleSoft Financial Management Documentation
  url: https://docs.oracle.com/en/applications/peoplesoft/financial-management/index.html
