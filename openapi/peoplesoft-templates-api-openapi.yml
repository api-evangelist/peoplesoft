openapi: 3.2.0
info:
  title: PeopleSoft Cloud Manager Templates API
  description: REST APIs for automated environment provisioning and deployment on Oracle Cloud Infrastructure including PeopleTools upgrades, update management, and self-service provisioning templates.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/api/cloudmgr/v1
  description: PeopleSoft Cloud Manager Instance
  variables:
    hostname:
      description: Cloud Manager server hostname
      default: localhost
    port:
      description: Cloud Manager server port
      default: '8000'
tags:
- name: Templates
  description: Provisioning template operations
paths:
  /templates:
    get:
      summary: PeopleSoft List Templates
      description: Retrieve available provisioning templates.
      operationId: listTemplates
      tags:
      - Templates
      security:
      - basicAuth: []
      responses:
        '200':
          description: Successful response with template list
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: PeopleSoft Cloud Manager Documentation
  url: https://docs.oracle.com/cd/E52319_01/infoportal/cloudmgr.html
