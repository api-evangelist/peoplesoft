openapi: 3.1.0
info:
  title: PeopleSoft Application Services Framework Accounts Payable Jobs API
  description: Modern REST API layer introduced in PeopleTools 8.59 that produces fully compliant OpenAPI/Swagger specifications, supports proper HTTP status codes, uniform URLs, and JSON payloads for integration with Oracle Integration Cloud, mobile apps, and microservices.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/asf/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: Jobs
  description: Job posting and search operations
paths:
  /jobs:
    get:
      summary: PeopleSoft Search Jobs
      description: Search available job postings.
      operationId: searchJobs
      tags:
      - Jobs
      parameters:
      - name: keyword
        in: query
        description: Keyword search term
        schema:
          type: string
        example: example_value
      - name: location
        in: query
        description: Job location filter
        schema:
          type: string
        example: example_value
      - name: department
        in: query
        description: Department filter
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: Successful response with job listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        jobId:
                          type: string
                        title:
                          type: string
                        department:
                          type: string
                        location:
                          type: string
                        postingDate:
                          type: string
                          format: date
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /jobs/{jobId}:
    get:
      summary: PeopleSoft Get Job Details
      description: Retrieve details for a specific job posting.
      operationId: getJobDetails
      tags:
      - Jobs
      parameters:
      - name: jobId
        in: path
        required: true
        description: The job posting identifier
        schema:
          type: string
        example: PS123456
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Job not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{hostname}:{port}/psft/oauth/authorize
          tokenUrl: https://{hostname}:{port}/psft/oauth/token
          scopes: {}
externalDocs:
  description: Application Services Framework Documentation
  url: https://docs.oracle.com/cd/E52319_01/infoportal/asf.html
