openapi: 3.2.0
info:
  title: PeopleSoft CRM Sales API
  description: Customer Relationship Management REST API endpoints and integration points for customer data, case management, sales, and marketing.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/api/crm/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: Sales
  description: Sales operations
paths:
  /sales/opportunities:
    get:
      summary: PeopleSoft List Opportunities
      description: Retrieve sales opportunities.
      operationId: listOpportunities
      tags:
      - Sales
      security:
      - basicAuth: []
      responses:
        '200':
          description: Successful response with opportunities
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: PeopleSoft CRM REST API Documentation
  url: https://docs.oracle.com/cd/F95753_01/crm92pbr22/eng/crm/eccc/UnderstandingRestApiEndpointsForPeoplesoft.html
