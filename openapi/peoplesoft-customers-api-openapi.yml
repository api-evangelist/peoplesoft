openapi: 3.2.0
info:
  title: PeopleSoft CRM Customers API
  description: Customer Relationship Management REST API endpoints and integration points for customer data, case management, sales, and marketing.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/api/crm/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: Customers
  description: Customer data operations
paths:
  /customers:
    get:
      summary: PeopleSoft List Customers
      description: Retrieve customer records.
      operationId: listCustomers
      tags:
      - Customers
      security:
      - basicAuth: []
      parameters:
      - name: search
        in: query
        description: Search term for customer name or ID
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: Successful response with customer list
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /customers/{customerId}:
    get:
      summary: PeopleSoft Get Customer
      description: Retrieve details for a specific customer.
      operationId: getCustomer
      tags:
      - Customers
      security:
      - basicAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        description: The customer identifier
        schema:
          type: string
        example: PS123456
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
        '404':
          description: Customer not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: PeopleSoft CRM REST API Documentation
  url: https://docs.oracle.com/cd/F95753_01/crm92pbr22/eng/crm/eccc/UnderstandingRestApiEndpointsForPeoplesoft.html
