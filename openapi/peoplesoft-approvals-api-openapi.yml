openapi: 3.1.0
info:
  title: PeopleSoft Application Services Framework Accounts Payable Approvals API
  description: Modern REST API layer introduced in PeopleTools 8.59 that produces fully compliant OpenAPI/Swagger specifications, supports proper HTTP status codes, uniform URLs, and JSON payloads for integration with Oracle Integration Cloud, mobile apps, and microservices.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/asf/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: Approvals
  description: Approval workflow operations
paths:
  /approvals:
    get:
      summary: PeopleSoft List Pending Approvals
      description: Retrieve a list of pending approval requests for the current user.
      operationId: listPendingApprovals
      tags:
      - Approvals
      security:
      - basicAuth: []
      responses:
        '200':
          description: Successful response with pending approvals
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items:
                      type: object
                      properties:
                        approvalId:
                          type: string
                        transactionType:
                          type: string
                        status:
                          type: string
                        submittedBy:
                          type: string
                        submittedDate:
                          type: string
                          format: date-time
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /approvals/{approvalId}:
    put:
      summary: PeopleSoft Process Approval
      description: Approve, deny, or push back an approval request.
      operationId: processApproval
      tags:
      - Approvals
      security:
      - basicAuth: []
      parameters:
      - name: approvalId
        in: path
        required: true
        description: The approval request identifier
        schema:
          type: string
        example: PS123456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - approve
                  - deny
                  - pushback
                comments:
                  type: string
      responses:
        '200':
          description: Approval processed
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Approval not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{hostname}:{port}/psft/oauth/authorize
          tokenUrl: https://{hostname}:{port}/psft/oauth/token
          scopes: {}
externalDocs:
  description: Application Services Framework Documentation
  url: https://docs.oracle.com/cd/E52319_01/infoportal/asf.html
