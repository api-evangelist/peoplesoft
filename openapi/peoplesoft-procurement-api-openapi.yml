openapi: 3.2.0
info:
  title: PeopleSoft Supply Chain Management Procurement API
  description: REST API endpoints for procurement, inventory management, order fulfillment, logistics, and enterprise integration points for warehouse management systems.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/api/scm/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: Procurement
  description: Procurement and purchasing operations
paths:
  /procurement/requisitions:
    get:
      summary: PeopleSoft List Requisitions
      description: Retrieve procurement requisitions.
      operationId: listRequisitions
      tags:
      - Procurement
      security:
      - basicAuth: []
      responses:
        '200':
          description: Successful response with requisitions
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /procurement/purchase-orders:
    get:
      summary: PeopleSoft List Purchase Orders
      description: Retrieve purchase orders.
      operationId: listPurchaseOrders
      tags:
      - Procurement
      security:
      - basicAuth: []
      responses:
        '200':
          description: Successful response with purchase orders
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: PeopleSoft FSCM REST API Documentation
  url: https://docs.oracle.com/cd/F92336_01/fscm92pbr50/eng/fscm/eccf/UnderstandingRestApiEndpointsForPeoplesoft.html
