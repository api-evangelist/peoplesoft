openapi: 3.2.0
info:
  title: PeopleSoft Enterprise Performance Management Budgets API
  description: Analytics, budgeting, forecasting, and planning APIs with events and notifications framework for financial and operational performance management.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/api/epm/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: Budgets
  description: Budget management operations
paths:
  /budgets:
    get:
      summary: PeopleSoft List Budgets
      description: Retrieve budget definitions and data.
      operationId: listBudgets
      tags:
      - Budgets
      security:
      - basicAuth: []
      parameters:
      - name: fiscalYear
        in: query
        description: Fiscal year filter
        schema:
          type: string
        example: example_value
      - name: businessUnit
        in: query
        description: Business unit filter
        schema:
          type: string
        example: example_value
      responses:
        '200':
          description: Successful response with budget data
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: PeopleSoft EPM Documentation
  url: https://docs.oracle.com/cd/E41507_01/epm91pbr3/eng/epm/penw/index.html
