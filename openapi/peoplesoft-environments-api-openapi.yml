openapi: 3.1.0
info:
  title: PeopleSoft Application Services Framework Accounts Payable Environments API
  description: Modern REST API layer introduced in PeopleTools 8.59 that produces fully compliant OpenAPI/Swagger specifications, supports proper HTTP status codes, uniform URLs, and JSON payloads for integration with Oracle Integration Cloud, mobile apps, and microservices.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/asf/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: Environments
  description: Environment provisioning and management
paths:
  /environments:
    get:
      summary: PeopleSoft List Environments
      description: Retrieve a list of provisioned PeopleSoft environments.
      operationId: listEnvironments
      tags:
      - Environments
      security:
      - basicAuth: []
      responses:
        '200':
          description: Successful response with environment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  environments:
                    type: array
                    items:
                      type: object
                      properties:
                        environmentId:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                        toolsVersion:
                          type: string
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      summary: PeopleSoft Provision Environment
      description: Provision a new PeopleSoft environment on OCI from a template.
      operationId: provisionEnvironment
      tags:
      - Environments
      security:
      - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                environmentName:
                  type: string
                configuration:
                  type: object
      responses:
        '202':
          description: Provisioning initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  environmentId:
                    type: string
                  status:
                    type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{hostname}:{port}/psft/oauth/authorize
          tokenUrl: https://{hostname}:{port}/psft/oauth/token
          scopes: {}
externalDocs:
  description: Application Services Framework Documentation
  url: https://docs.oracle.com/cd/E52319_01/infoportal/asf.html
