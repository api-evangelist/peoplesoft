openapi: 3.1.0
info:
  title: PeopleSoft Application Framework Accounts Payable Services API
  description: Modern REST API layer introduced in PeopleTools 8.59 that produces fully compliant OpenAPI/Swagger specifications, supports proper HTTP status codes, uniform URLs, and JSON payloads for integration with Oracle Integration Cloud, mobile apps, and microservices.
  version: 1.0.0
  contact:
    name: Oracle Support
    email: support@oracle.com
    url: https://support.oracle.com
  license:
    name: Proprietary
    url: https://www.oracle.com/contracts/
servers:
- url: https://{hostname}:{port}/psft/asf/v1
  description: PeopleSoft Instance
  variables:
    hostname:
      description: PeopleSoft server hostname
      default: localhost
    port:
      description: PeopleSoft server port
      default: '8000'
tags:
- name: Services
  description: ASF service operations
paths:
  /{serviceName}:
    get:
      summary: PeopleSoft Get Service Resource
      description: Retrieve data from an ASF-defined service with OpenAPI-compliant response.
      operationId: getServiceResource
      tags:
      - Services
      security:
      - basicAuth: []
      - oauth2: []
      parameters:
      - name: serviceName
        in: path
        required: true
        description: The ASF service name
        schema:
          type: string
        example: Example Record
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
        '404':
          description: Service not found
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      summary: PeopleSoft Create Service Resource
      description: Create a resource via an ASF-defined service.
      operationId: createServiceResource
      tags:
      - Services
      security:
      - basicAuth: []
      - oauth2: []
      parameters:
      - name: serviceName
        in: path
        required: true
        description: The ASF service name
        schema:
          type: string
        example: Example Record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Unauthorized
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{hostname}:{port}/psft/oauth/authorize
          tokenUrl: https://{hostname}:{port}/psft/oauth/token
          scopes: {}
externalDocs:
  description: Application Services Framework Documentation
  url: https://docs.oracle.com/cd/E52319_01/infoportal/asf.html
