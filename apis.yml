- name: PeopleSoft Data Distribution Framework API
  description: Framework for extracting and flattening PeopleSoft data for machine learning and analytics purposes.
    Uses PeopleSoft Search Framework technology with OpenSearch to build, index, and register data models that can
    be exposed as REST APIs.
