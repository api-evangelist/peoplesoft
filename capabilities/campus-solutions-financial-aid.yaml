naftiko: 1.0.0-alpha2
info:
  label: PeopleSoft Campus Solutions API — Financial Aid
  description: 'PeopleSoft Campus Solutions API — Financial Aid. 1 operations. Lead operation: PeopleSoft List Financial Aid
    Awards. Self-contained Naftiko capability covering one Peoplesoft business surface.'
  tags:
  - Peoplesoft
  - Financial Aid
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PEOPLESOFT_API_KEY: PEOPLESOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: campus-solutions-financial-aid
    baseUri: https://{hostname}:{port}/psft/api/campus/v1
    description: PeopleSoft Campus Solutions API — Financial Aid business capability. Self-contained, no shared references.
    resources:
    - name: financial-aid-awards
      path: /financial-aid/awards
      operations:
      - name: listfinancialaidawards
        method: GET
        description: PeopleSoft List Financial Aid Awards
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.PEOPLESOFT_USER}}'
      password: '{{env.PEOPLESOFT_PASS}}'
  exposes:
  - type: rest
    namespace: campus-solutions-financial-aid-rest
    port: 8080
    description: REST adapter for PeopleSoft Campus Solutions API — Financial Aid. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/financial-aid/awards
      name: financial-aid-awards
      description: REST surface for financial-aid-awards.
      operations:
      - method: GET
        name: listfinancialaidawards
        description: PeopleSoft List Financial Aid Awards
        call: campus-solutions-financial-aid.listfinancialaidawards
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: campus-solutions-financial-aid-mcp
    port: 9090
    transport: http
    description: MCP adapter for PeopleSoft Campus Solutions API — Financial Aid. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: peoplesoft-list-financial-aid-awards
      description: PeopleSoft List Financial Aid Awards
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: campus-solutions-financial-aid.listfinancialaidawards
      outputParameters:
      - type: object
        mapping: $.
