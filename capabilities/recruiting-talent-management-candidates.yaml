naftiko: 1.0.0-alpha2
info:
  label: PeopleSoft Recruiting and Talent Management API — Candidates
  description: 'PeopleSoft Recruiting and Talent Management API — Candidates. 1 operations. Lead operation: PeopleSoft Submit
    Application. Self-contained Naftiko capability covering one Peoplesoft business surface.'
  tags:
  - Peoplesoft
  - Candidates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PEOPLESOFT_API_KEY: PEOPLESOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: recruiting-talent-management-candidates
    baseUri: https://{hostname}:{port}/psft/api/hcm/recruiting/v1
    description: PeopleSoft Recruiting and Talent Management API — Candidates business capability. Self-contained, no shared
      references.
    resources:
    - name: candidates-applications
      path: /candidates/applications
      operations:
      - name: submitapplication
        method: POST
        description: PeopleSoft Submit Application
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.PEOPLESOFT_USER}}'
      password: '{{env.PEOPLESOFT_PASS}}'
  exposes:
  - type: rest
    namespace: recruiting-talent-management-candidates-rest
    port: 8080
    description: REST adapter for PeopleSoft Recruiting and Talent Management API — Candidates. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/candidates/applications
      name: candidates-applications
      description: REST surface for candidates-applications.
      operations:
      - method: POST
        name: submitapplication
        description: PeopleSoft Submit Application
        call: recruiting-talent-management-candidates.submitapplication
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: recruiting-talent-management-candidates-mcp
    port: 9090
    transport: http
    description: MCP adapter for PeopleSoft Recruiting and Talent Management API — Candidates. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: peoplesoft-submit-application
      description: PeopleSoft Submit Application
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: recruiting-talent-management-candidates.submitapplication
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
