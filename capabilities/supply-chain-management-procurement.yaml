naftiko: 1.0.0-alpha2
info:
  label: PeopleSoft Supply Chain Management API — Procurement
  description: 'PeopleSoft Supply Chain Management API — Procurement. 2 operations. Lead operation: PeopleSoft List Purchase
    Orders. Self-contained Naftiko capability covering one Peoplesoft business surface.'
  tags:
  - Peoplesoft
  - Procurement
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PEOPLESOFT_API_KEY: PEOPLESOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: supply-chain-management-procurement
    baseUri: https://{hostname}:{port}/psft/api/scm/v1
    description: PeopleSoft Supply Chain Management API — Procurement business capability. Self-contained, no shared references.
    resources:
    - name: procurement-purchase-orders
      path: /procurement/purchase-orders
      operations:
      - name: listpurchaseorders
        method: GET
        description: PeopleSoft List Purchase Orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: procurement-requisitions
      path: /procurement/requisitions
      operations:
      - name: listrequisitions
        method: GET
        description: PeopleSoft List Requisitions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.PEOPLESOFT_USER}}'
      password: '{{env.PEOPLESOFT_PASS}}'
  exposes:
  - type: rest
    namespace: supply-chain-management-procurement-rest
    port: 8080
    description: REST adapter for PeopleSoft Supply Chain Management API — Procurement. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/procurement/purchase-orders
      name: procurement-purchase-orders
      description: REST surface for procurement-purchase-orders.
      operations:
      - method: GET
        name: listpurchaseorders
        description: PeopleSoft List Purchase Orders
        call: supply-chain-management-procurement.listpurchaseorders
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/procurement/requisitions
      name: procurement-requisitions
      description: REST surface for procurement-requisitions.
      operations:
      - method: GET
        name: listrequisitions
        description: PeopleSoft List Requisitions
        call: supply-chain-management-procurement.listrequisitions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: supply-chain-management-procurement-mcp
    port: 9090
    transport: http
    description: MCP adapter for PeopleSoft Supply Chain Management API — Procurement. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: peoplesoft-list-purchase-orders
      description: PeopleSoft List Purchase Orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: supply-chain-management-procurement.listpurchaseorders
      outputParameters:
      - type: object
        mapping: $.
    - name: peoplesoft-list-requisitions
      description: PeopleSoft List Requisitions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: supply-chain-management-procurement.listrequisitions
      outputParameters:
      - type: object
        mapping: $.
