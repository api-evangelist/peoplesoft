naftiko: 1.0.0-alpha2
info:
  label: PeopleSoft Platform Administration
  description: Unified workflow for IT administrators combining environment provisioning, update management, process scheduling,
    integration broker, REST API management, application services framework, and component interface operations across PeopleSoft
    platform APIs.
  tags:
  - PeopleSoft
  - Platform Administration
  - Cloud Manager
  - Integration
  - DevOps
  - PeopleTools
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    PEOPLESOFT_USERNAME: PEOPLESOFT_USERNAME
    PEOPLESOFT_PASSWORD: PEOPLESOFT_PASSWORD
capability:
  consumes:
  - type: http
    namespace: cloud-manager
    baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/cloudmgr/v1
    description: PeopleSoft Cloud Manager API
    authentication:
      type: basic
      username: '{{PEOPLESOFT_USERNAME}}'
      password: '{{PEOPLESOFT_PASSWORD}}'
    resources:
    - name: environments
      path: /environments
      description: Environment provisioning and management
      operations:
      - name: list-environments
        method: GET
        description: Retrieve a list of provisioned PeopleSoft environments.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: provision-environment
        method: POST
        description: Provision a new PeopleSoft environment on OCI from a template.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            templateId: '{{tools.templateId}}'
            environmentName: '{{tools.environmentName}}'
            configuration: '{{tools.configuration}}'
    - name: templates
      path: /templates
      description: Provisioning template operations
      operations:
      - name: list-templates
        method: GET
        description: Retrieve available provisioning templates.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: update-manager
    baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/pum/v1
    description: PeopleSoft Update Manager API
    authentication:
      type: basic
      username: '{{PEOPLESOFT_USERNAME}}'
      password: '{{PEOPLESOFT_PASSWORD}}'
    resources:
    - name: updates
      path: /updates
      description: Update and patch management operations
      operations:
      - name: list-updates
        method: GET
        description: Retrieve a list of available updates and change packages.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: apply-update
        method: POST
        description: Initiate application of a specific update or change package.
        inputParameters:
        - name: updateId
          in: path
          type: string
          required: true
          description: The update identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: process-scheduler
    baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/scheduler/v1
    description: PeopleSoft Process Scheduler API
    authentication:
      type: basic
      username: '{{PEOPLESOFT_USERNAME}}'
      password: '{{PEOPLESOFT_PASSWORD}}'
    resources:
    - name: processes
      path: /processes
      description: Process scheduling and monitoring operations
      operations:
      - name: list-processes
        method: GET
        description: Retrieve a list of process requests and their run status.
        inputParameters:
        - name: status
          in: query
          type: string
          required: false
          description: Filter by process status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: submit-process
        method: POST
        description: Submit a new process request for scheduling.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            processName: '{{tools.processName}}'
            processType: '{{tools.processType}}'
            serverName: '{{tools.serverName}}'
            runDateTime: '{{tools.runDateTime}}'
            parameters: '{{tools.parameters}}'
      - name: get-process-status
        method: GET
        description: Retrieve the status and details of a specific process instance.
        inputParameters:
        - name: processInstance
          in: path
          type: integer
          required: true
          description: The process instance number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: integration-broker
    baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/PSIGW/RESTListeningConnector
    description: PeopleSoft Integration Broker
    authentication:
      type: basic
      username: '{{PEOPLESOFT_USERNAME}}'
      password: '{{PEOPLESOFT_PASSWORD}}'
    resources:
    - name: service-operations
      path: /
      description: Integration Broker service operations
      operations:
      - name: get-service-operation
        method: GET
        description: Invoke a synchronous Integration Broker REST service operation using GET.
        inputParameters:
        - name: serviceOperation
          in: path
          type: string
          required: true
          description: The service operation name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: post-service-operation
        method: POST
        description: Invoke a synchronous or asynchronous Integration Broker REST service operation using POST.
        inputParameters:
        - name: serviceOperation
          in: path
          type: string
          required: true
          description: The service operation name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            payload: '{{tools.payload}}'
  - type: http
    namespace: rest-api
    baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/v1
    description: PeopleSoft REST API
    authentication:
      type: basic
      username: '{{PEOPLESOFT_USERNAME}}'
      password: '{{PEOPLESOFT_PASSWORD}}'
    resources:
    - name: resources
      path: /
      description: PeopleSoft REST resource operations
      operations:
      - name: get-resource
        method: GET
        description: Retrieve PeopleSoft resource data via REST.
        inputParameters:
        - name: resource
          in: path
          type: string
          required: true
          description: The PeopleSoft resource name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-resource
        method: POST
        description: Create a new PeopleSoft resource via REST.
        inputParameters:
        - name: resource
          in: path
          type: string
          required: true
          description: The PeopleSoft resource name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            resource: '{{tools.resource}}'
  - type: http
    namespace: asf
    baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/asf/v1
    description: PeopleSoft Application Services Framework API
    authentication:
      type: basic
      username: '{{PEOPLESOFT_USERNAME}}'
      password: '{{PEOPLESOFT_PASSWORD}}'
    resources:
    - name: services
      path: /
      description: ASF service operations
      operations:
      - name: get-service-resource
        method: GET
        description: Retrieve data from an ASF-defined service with OpenAPI-compliant response.
        inputParameters:
        - name: serviceName
          in: path
          type: string
          required: true
          description: The ASF service name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-service-resource
        method: POST
        description: Create a resource via an ASF-defined service.
        inputParameters:
        - name: serviceName
          in: path
          type: string
          required: true
          description: The ASF service name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            serviceName: '{{tools.serviceName}}'
  - type: http
    namespace: component-interface
    baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/componentinterface/v1
    description: PeopleSoft Component Interface API
    authentication:
      type: basic
      username: '{{PEOPLESOFT_USERNAME}}'
      password: '{{PEOPLESOFT_PASSWORD}}'
    resources:
    - name: component-interfaces
      path: /
      description: Component interface operations
      operations:
      - name: get-component-data
        method: GET
        description: Retrieve data from a PeopleSoft component interface.
        inputParameters:
        - name: componentInterface
          in: path
          type: string
          required: true
          description: The component interface name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-component-data
        method: POST
        description: Create a new record via a PeopleSoft component interface.
        inputParameters:
        - name: componentInterface
          in: path
          type: string
          required: true
          description: The component interface name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            componentInterface: '{{tools.componentInterface}}'
      - name: update-component-data
        method: PUT
        description: Update an existing record via a PeopleSoft component interface.
        inputParameters:
        - name: componentInterface
          in: path
          type: string
          required: true
          description: The component interface name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            componentInterface: '{{tools.componentInterface}}'
  exposes:
  - type: rest
    port: 8085
    namespace: platform-admin-api
    description: Unified REST API for PeopleSoft platform administration workflows.
    resources:
    - path: /v1/environments
      name: environments
      description: PeopleSoft environments
      operations:
      - method: GET
        name: list-environments
        description: Retrieve provisioned environments.
        call: cloud-manager.list-environments
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: provision-environment
        description: Provision a new environment.
        call: cloud-manager.provision-environment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/templates
      name: templates
      description: Provisioning templates
      operations:
      - method: GET
        name: list-templates
        description: Retrieve available provisioning templates.
        call: cloud-manager.list-templates
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/updates
      name: updates
      description: Available updates and change packages
      operations:
      - method: GET
        name: list-updates
        description: Retrieve available updates.
        call: update-manager.list-updates
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/updates/{updateId}/apply
      name: update-apply
      description: Apply updates
      operations:
      - method: POST
        name: apply-update
        description: Initiate application of a specific update.
        call: update-manager.apply-update
        with:
          updateId: rest.updateId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/processes
      name: processes
      description: Process requests
      operations:
      - method: GET
        name: list-processes
        description: Retrieve process requests and their run status.
        call: process-scheduler.list-processes
        with:
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: submit-process
        description: Submit a new process request.
        call: process-scheduler.submit-process
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/processes/{processInstance}
      name: process-detail
      description: Process instance details
      operations:
      - method: GET
        name: get-process-status
        description: Retrieve the status of a specific process instance.
        call: process-scheduler.get-process-status
        with:
          processInstance: rest.processInstance
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/service-operations/{serviceOperation}
      name: service-operations
      description: Integration Broker service operations
      operations:
      - method: GET
        name: get-service-operation
        description: Invoke a service operation using GET.
        call: integration-broker.get-service-operation
        with:
          serviceOperation: rest.serviceOperation
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: post-service-operation
        description: Invoke a service operation using POST.
        call: integration-broker.post-service-operation
        with:
          serviceOperation: rest.serviceOperation
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/resources/{resource}
      name: resources
      description: PeopleSoft REST resources
      operations:
      - method: GET
        name: get-resource
        description: Retrieve PeopleSoft resource data.
        call: rest-api.get-resource
        with:
          resource: rest.resource
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-resource
        description: Create a new PeopleSoft resource.
        call: rest-api.create-resource
        with:
          resource: rest.resource
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/{serviceName}
      name: services
      description: ASF service resources
      operations:
      - method: GET
        name: get-service-resource
        description: Retrieve data from an ASF-defined service.
        call: asf.get-service-resource
        with:
          serviceName: rest.serviceName
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-service-resource
        description: Create a resource via an ASF-defined service.
        call: asf.create-service-resource
        with:
          serviceName: rest.serviceName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/component-interfaces/{componentInterface}
      name: component-interfaces
      description: Component interface resources
      operations:
      - method: GET
        name: get-component-data
        description: Retrieve data from a component interface.
        call: component-interface.get-component-data
        with:
          componentInterface: rest.componentInterface
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-component-data
        description: Create a new record via a component interface.
        call: component-interface.create-component-data
        with:
          componentInterface: rest.componentInterface
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: update-component-data
        description: Update an existing record via a component interface.
        call: component-interface.update-component-data
        with:
          componentInterface: rest.componentInterface
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9095
    namespace: platform-admin-mcp
    transport: http
    description: MCP server for AI-assisted PeopleSoft platform administration workflows.
    tools:
    - name: list-environments
      description: Retrieve provisioned PeopleSoft environments.
      hints:
        readOnly: true
        openWorld: true
      call: cloud-manager.list-environments
      outputParameters:
      - type: object
        mapping: $.
    - name: provision-environment
      description: Provision a new PeopleSoft environment on OCI.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloud-manager.provision-environment
      with:
        templateId: tools.templateId
        environmentName: tools.environmentName
        configuration: tools.configuration
      outputParameters:
      - type: object
        mapping: $.
    - name: list-templates
      description: Retrieve available provisioning templates.
      hints:
        readOnly: true
        openWorld: true
      call: cloud-manager.list-templates
      outputParameters:
      - type: object
        mapping: $.
    - name: list-updates
      description: Retrieve available updates and change packages.
      hints:
        readOnly: true
        openWorld: true
      call: update-manager.list-updates
      outputParameters:
      - type: object
        mapping: $.
    - name: apply-update
      description: Initiate application of a specific update or change package.
      hints:
        readOnly: false
        destructive: true
        idempotent: false
      call: update-manager.apply-update
      with:
        updateId: tools.updateId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-processes
      description: Retrieve process requests and their run status.
      hints:
        readOnly: true
        openWorld: true
      call: process-scheduler.list-processes
      with:
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: submit-process
      description: Submit a new process request for scheduling.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: process-scheduler.submit-process
      with:
        processName: tools.processName
        processType: tools.processType
        serverName: tools.serverName
        runDateTime: tools.runDateTime
        parameters: tools.parameters
      outputParameters:
      - type: object
        mapping: $.
    - name: get-process-status
      description: Retrieve the status of a specific process instance.
      hints:
        readOnly: true
        openWorld: true
      call: process-scheduler.get-process-status
      with:
        processInstance: tools.processInstance
      outputParameters:
      - type: object
        mapping: $.
    - name: get-service-operation
      description: Invoke a synchronous Integration Broker service operation using GET.
      hints:
        readOnly: true
        openWorld: true
      call: integration-broker.get-service-operation
      with:
        serviceOperation: tools.serviceOperation
      outputParameters:
      - type: object
        mapping: $.
    - name: post-service-operation
      description: Invoke an Integration Broker service operation using POST.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: integration-broker.post-service-operation
      with:
        serviceOperation: tools.serviceOperation
        payload: tools.payload
      outputParameters:
      - type: object
        mapping: $.
    - name: get-resource
      description: Retrieve PeopleSoft resource data via REST.
      hints:
        readOnly: true
        openWorld: true
      call: rest-api.get-resource
      with:
        resource: tools.resource
      outputParameters:
      - type: object
        mapping: $.
    - name: create-resource
      description: Create a new PeopleSoft resource via REST.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-api.create-resource
      with:
        resource: tools.resource
      outputParameters:
      - type: object
        mapping: $.
    - name: get-service-resource
      description: Retrieve data from an ASF-defined service.
      hints:
        readOnly: true
        openWorld: true
      call: asf.get-service-resource
      with:
        serviceName: tools.serviceName
      outputParameters:
      - type: object
        mapping: $.
    - name: create-service-resource
      description: Create a resource via an ASF-defined service.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: asf.create-service-resource
      with:
        serviceName: tools.serviceName
      outputParameters:
      - type: object
        mapping: $.
    - name: get-component-data
      description: Retrieve data from a PeopleSoft component interface.
      hints:
        readOnly: true
        openWorld: true
      call: component-interface.get-component-data
      with:
        componentInterface: tools.componentInterface
      outputParameters:
      - type: object
        mapping: $.
    - name: create-component-data
      description: Create a new record via a PeopleSoft component interface.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: component-interface.create-component-data
      with:
        componentInterface: tools.componentInterface
      outputParameters:
      - type: object
        mapping: $.
    - name: update-component-data
      description: Update an existing record via a PeopleSoft component interface.
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: component-interface.update-component-data
      with:
        componentInterface: tools.componentInterface
      outputParameters:
      - type: object
        mapping: $.
