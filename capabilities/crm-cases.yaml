naftiko: 1.0.0-alpha2
info:
  label: PeopleSoft CRM API — Cases
  description: 'PeopleSoft CRM API — Cases. 2 operations. Lead operation: PeopleSoft List Cases. Self-contained Naftiko capability
    covering one Peoplesoft business surface.'
  tags:
  - Peoplesoft
  - Cases
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PEOPLESOFT_API_KEY: PEOPLESOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: crm-cases
    baseUri: https://{hostname}:{port}/psft/api/crm/v1
    description: PeopleSoft CRM API — Cases business capability. Self-contained, no shared references.
    resources:
    - name: cases
      path: /cases
      operations:
      - name: listcases
        method: GET
        description: PeopleSoft List Cases
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcase
        method: POST
        description: PeopleSoft Create Case
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.PEOPLESOFT_USER}}'
      password: '{{env.PEOPLESOFT_PASS}}'
  exposes:
  - type: rest
    namespace: crm-cases-rest
    port: 8080
    description: REST adapter for PeopleSoft CRM API — Cases. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/cases
      name: cases
      description: REST surface for cases.
      operations:
      - method: GET
        name: listcases
        description: PeopleSoft List Cases
        call: crm-cases.listcases
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcase
        description: PeopleSoft Create Case
        call: crm-cases.createcase
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: crm-cases-mcp
    port: 9090
    transport: http
    description: MCP adapter for PeopleSoft CRM API — Cases. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: peoplesoft-list-cases
      description: PeopleSoft List Cases
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: crm-cases.listcases
      outputParameters:
      - type: object
        mapping: $.
    - name: peoplesoft-create-case
      description: PeopleSoft Create Case
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: crm-cases.createcase
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
