naftiko: 1.0.0-alpha2
info:
  label: PeopleSoft Cloud Manager API — Templates
  description: 'PeopleSoft Cloud Manager API — Templates. 1 operations. Lead operation: PeopleSoft List Templates. Self-contained
    Naftiko capability covering one Peoplesoft business surface.'
  tags:
  - Peoplesoft
  - Templates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PEOPLESOFT_API_KEY: PEOPLESOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-manager-templates
    baseUri: https://{hostname}:{port}/psft/api/cloudmgr/v1
    description: PeopleSoft Cloud Manager API — Templates business capability. Self-contained, no shared references.
    resources:
    - name: templates
      path: /templates
      operations:
      - name: listtemplates
        method: GET
        description: PeopleSoft List Templates
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.PEOPLESOFT_USER}}'
      password: '{{env.PEOPLESOFT_PASS}}'
  exposes:
  - type: rest
    namespace: cloud-manager-templates-rest
    port: 8080
    description: REST adapter for PeopleSoft Cloud Manager API — Templates. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/templates
      name: templates
      description: REST surface for templates.
      operations:
      - method: GET
        name: listtemplates
        description: PeopleSoft List Templates
        call: cloud-manager-templates.listtemplates
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-manager-templates-mcp
    port: 9090
    transport: http
    description: MCP adapter for PeopleSoft Cloud Manager API — Templates. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: peoplesoft-list-templates
      description: PeopleSoft List Templates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-manager-templates.listtemplates
      outputParameters:
      - type: object
        mapping: $.
