naftiko: 1.0.0-alpha2
info:
  label: PeopleSoft Financials API — General Ledger
  description: 'PeopleSoft Financials API — General Ledger. 1 operations. Lead operation: PeopleSoft List Journal Entries.
    Self-contained Naftiko capability covering one Peoplesoft business surface.'
  tags:
  - Peoplesoft
  - General Ledger
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PEOPLESOFT_API_KEY: PEOPLESOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: financials-general-ledger
    baseUri: https://{hostname}:{port}/psft/api/financials/v1
    description: PeopleSoft Financials API — General Ledger business capability. Self-contained, no shared references.
    resources:
    - name: gl-journals
      path: /gl/journals
      operations:
      - name: listjournalentries
        method: GET
        description: PeopleSoft List Journal Entries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: businessUnit
          in: query
          type: string
          description: Business unit filter
        - name: fromDate
          in: query
          type: string
          description: Start date filter
        - name: toDate
          in: query
          type: string
          description: End date filter
    authentication:
      type: basic
      username: '{{env.PEOPLESOFT_USER}}'
      password: '{{env.PEOPLESOFT_PASS}}'
  exposes:
  - type: rest
    namespace: financials-general-ledger-rest
    port: 8080
    description: REST adapter for PeopleSoft Financials API — General Ledger. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/gl/journals
      name: gl-journals
      description: REST surface for gl-journals.
      operations:
      - method: GET
        name: listjournalentries
        description: PeopleSoft List Journal Entries
        call: financials-general-ledger.listjournalentries
        with:
          businessUnit: rest.businessUnit
          fromDate: rest.fromDate
          toDate: rest.toDate
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: financials-general-ledger-mcp
    port: 9090
    transport: http
    description: MCP adapter for PeopleSoft Financials API — General Ledger. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: peoplesoft-list-journal-entries
      description: PeopleSoft List Journal Entries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: financials-general-ledger.listjournalentries
      with:
        businessUnit: tools.businessUnit
        fromDate: tools.fromDate
        toDate: tools.toDate
      outputParameters:
      - type: object
        mapping: $.
