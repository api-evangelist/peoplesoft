naftiko: 1.0.0-alpha2
info:
  label: PeopleSoft HCM API — Benefits
  description: 'PeopleSoft HCM API — Benefits. 1 operations. Lead operation: PeopleSoft List Benefit Enrollments. Self-contained
    Naftiko capability covering one Peoplesoft business surface.'
  tags:
  - Peoplesoft
  - Benefits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PEOPLESOFT_API_KEY: PEOPLESOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: hcm-benefits
    baseUri: https://{hostname}:{port}/psft/api/hcm/v1
    description: PeopleSoft HCM API — Benefits business capability. Self-contained, no shared references.
    resources:
    - name: benefits-enrollments
      path: /benefits/enrollments
      operations:
      - name: listbenefitenrollments
        method: GET
        description: PeopleSoft List Benefit Enrollments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.PEOPLESOFT_USER}}'
      password: '{{env.PEOPLESOFT_PASS}}'
  exposes:
  - type: rest
    namespace: hcm-benefits-rest
    port: 8080
    description: REST adapter for PeopleSoft HCM API — Benefits. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/benefits/enrollments
      name: benefits-enrollments
      description: REST surface for benefits-enrollments.
      operations:
      - method: GET
        name: listbenefitenrollments
        description: PeopleSoft List Benefit Enrollments
        call: hcm-benefits.listbenefitenrollments
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: hcm-benefits-mcp
    port: 9090
    transport: http
    description: MCP adapter for PeopleSoft HCM API — Benefits. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: peoplesoft-list-benefit-enrollments
      description: PeopleSoft List Benefit Enrollments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hcm-benefits.listbenefitenrollments
      outputParameters:
      - type: object
        mapping: $.
