naftiko: "1.0.0-alpha1"

info:
  label: "PeopleSoft Search Framework"
  description: "Search indexing and query capabilities powered by OpenSearch for full-text search, analytics dashboards, and PeopleSoft Insights."
  tags:
    - PeopleSoft
    - Search
    - Indexing
    - Full Text Search
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      PEOPLESOFT_USERNAME: PEOPLESOFT_USERNAME
      PEOPLESOFT_PASSWORD: PEOPLESOFT_PASSWORD

capability:
  consumes:
    - type: http
      namespace: search-framework
      baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/search/v1
      description: "PeopleSoft Search Framework API"
      authentication:
        type: basic
        username: "{{PEOPLESOFT_USERNAME}}"
        password: "{{PEOPLESOFT_PASSWORD}}"
      resources:
        - name: search
          path: /
          description: "Search and indexing operations"
          operations:
            - name: search-content
              method: GET
              description: "Execute a full-text search across PeopleSoft indexed content."
              inputParameters:
                - name: q
                  in: query
                  type: string
                  required: true
                  description: "Search query string"
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Search category to filter results"
                - name: maxResults
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of results to return"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: trigger-index-build
              method: POST
              description: "Trigger a search index build or incremental update."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  indexName: "{{tools.indexName}}"
                  buildType: "{{tools.buildType}}"

  exposes:
    - type: rest
      port: 8118
      namespace: search-framework-api
      resources:
        - path: /v1/search-results
          name: search-results
          description: "Full-text search results"
          operations:
            - method: GET
              name: search-content
              description: "Execute a full-text search across PeopleSoft indexed content."
              call: "search-framework.search-content"
              with:
                q: "rest.q"
                category: "rest.category"
                maxResults: "rest.maxResults"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/search-indexes
          name: search-indexes
          description: "Search index operations"
          operations:
            - method: POST
              name: trigger-index-build
              description: "Trigger a search index build or incremental update."
              call: "search-framework.trigger-index-build"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9118
      namespace: search-framework-mcp
      transport: http
      tools:
        - name: search-content
          description: "Execute a full-text search across PeopleSoft indexed content."
          hints:
            readOnly: true
            openWorld: true
          call: "search-framework.search-content"
          with:
            q: "tools.q"
            category: "tools.category"
            maxResults: "tools.maxResults"
          outputParameters:
            - type: object
              mapping: "$."
        - name: trigger-index-build
          description: "Trigger a search index build or incremental update."
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "search-framework.trigger-index-build"
          with:
            indexName: "tools.indexName"
            buildType: "tools.buildType"
          outputParameters:
            - type: object
              mapping: "$."
