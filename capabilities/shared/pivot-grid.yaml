naftiko: "1.0.0-alpha1"

info:
  label: "PeopleSoft Pivot Grid"
  description: "Operational dashboard reporting using PS Query, Composite Query, or component data sources accessible via web services for analytics and visualization."
  tags:
    - PeopleSoft
    - Pivot Grid
    - Dashboards
    - Analytics
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      PEOPLESOFT_USERNAME: PEOPLESOFT_USERNAME
      PEOPLESOFT_PASSWORD: PEOPLESOFT_PASSWORD

capability:
  consumes:
    - type: http
      namespace: pivot-grid
      baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/pivotgrid/v1
      description: "PeopleSoft Pivot Grid API"
      authentication:
        type: basic
        username: "{{PEOPLESOFT_USERNAME}}"
        password: "{{PEOPLESOFT_PASSWORD}}"
      resources:
        - name: grids
          path: /grids
          description: "Pivot grid and dashboard operations"
          operations:
            - name: list-pivot-grids
              method: GET
              description: "Retrieve a list of available pivot grid definitions."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-pivot-grid-data
              method: GET
              description: "Retrieve data for a specific pivot grid with optional filters."
              inputParameters:
                - name: gridId
                  in: path
                  type: string
                  required: true
                  description: "The pivot grid identifier"
                - name: filters
                  in: query
                  type: string
                  required: false
                  description: "JSON-encoded filter criteria"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8113
      namespace: pivot-grid-api
      resources:
        - path: /v1/pivot-grids
          name: pivot-grids
          description: "Pivot grid definitions"
          operations:
            - method: GET
              name: list-pivot-grids
              description: "Retrieve available pivot grid definitions."
              call: "pivot-grid.list-pivot-grids"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/pivot-grids/{gridId}/data
          name: pivot-grid-data
          description: "Pivot grid data"
          operations:
            - method: GET
              name: get-pivot-grid-data
              description: "Retrieve data for a specific pivot grid."
              call: "pivot-grid.get-pivot-grid-data"
              with:
                gridId: "rest.gridId"
                filters: "rest.filters"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9113
      namespace: pivot-grid-mcp
      transport: http
      tools:
        - name: list-pivot-grids
          description: "Retrieve a list of available pivot grid definitions."
          hints:
            readOnly: true
            openWorld: true
          call: "pivot-grid.list-pivot-grids"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-pivot-grid-data
          description: "Retrieve data for a specific pivot grid with optional filters."
          hints:
            readOnly: true
            openWorld: true
          call: "pivot-grid.get-pivot-grid-data"
          with:
            gridId: "tools.gridId"
            filters: "tools.filters"
          outputParameters:
            - type: object
              mapping: "$."
