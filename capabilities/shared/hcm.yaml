naftiko: "1.0.0-alpha1"

info:
  label: "PeopleSoft HCM"
  description: "Human Capital Management APIs for employee data, benefits, payroll, workforce administration, and talent management."
  tags:
    - PeopleSoft
    - HCM
    - Human Resources
    - Payroll
    - Benefits
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      PEOPLESOFT_USERNAME: PEOPLESOFT_USERNAME
      PEOPLESOFT_PASSWORD: PEOPLESOFT_PASSWORD

capability:
  consumes:
    - type: http
      namespace: hcm
      baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/hcm/v1
      description: "PeopleSoft HCM API"
      authentication:
        type: basic
        username: "{{PEOPLESOFT_USERNAME}}"
        password: "{{PEOPLESOFT_PASSWORD}}"
      resources:
        - name: employees
          path: /employees
          description: "Employee data operations"
          operations:
            - name: list-employees
              method: GET
              description: "Retrieve a list of employee records."
              inputParameters:
                - name: department
                  in: query
                  type: string
                  required: false
                  description: "Filter by department"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by employment status"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-employee
              method: GET
              description: "Retrieve details for a specific employee."
              inputParameters:
                - name: employeeId
                  in: path
                  type: string
                  required: true
                  description: "The employee identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: benefits
          path: /benefits
          description: "Benefits administration operations"
          operations:
            - name: list-benefit-enrollments
              method: GET
              description: "Retrieve benefit enrollment records."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: payroll
          path: /payroll
          description: "Payroll operations"
          operations:
            - name: list-payroll-runs
              method: GET
              description: "Retrieve payroll run history and status."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8109
      namespace: hcm-api
      resources:
        - path: /v1/employees
          name: employees
          description: "Employee records"
          operations:
            - method: GET
              name: list-employees
              description: "Retrieve employee records."
              call: "hcm.list-employees"
              with:
                department: "rest.department"
                status: "rest.status"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/employees/{employeeId}
          name: employee-detail
          description: "Individual employee details"
          operations:
            - method: GET
              name: get-employee
              description: "Retrieve details for a specific employee."
              call: "hcm.get-employee"
              with:
                employeeId: "rest.employeeId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/benefit-enrollments
          name: benefit-enrollments
          description: "Benefit enrollment records"
          operations:
            - method: GET
              name: list-benefit-enrollments
              description: "Retrieve benefit enrollment records."
              call: "hcm.list-benefit-enrollments"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/payroll-runs
          name: payroll-runs
          description: "Payroll run history"
          operations:
            - method: GET
              name: list-payroll-runs
              description: "Retrieve payroll run history and status."
              call: "hcm.list-payroll-runs"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9109
      namespace: hcm-mcp
      transport: http
      tools:
        - name: list-employees
          description: "Retrieve a list of employee records."
          hints:
            readOnly: true
            openWorld: true
          call: "hcm.list-employees"
          with:
            department: "tools.department"
            status: "tools.status"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-employee
          description: "Retrieve details for a specific employee."
          hints:
            readOnly: true
            openWorld: true
          call: "hcm.get-employee"
          with:
            employeeId: "tools.employeeId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-benefit-enrollments
          description: "Retrieve benefit enrollment records."
          hints:
            readOnly: true
            openWorld: true
          call: "hcm.list-benefit-enrollments"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-payroll-runs
          description: "Retrieve payroll run history and status."
          hints:
            readOnly: true
            openWorld: true
          call: "hcm.list-payroll-runs"
          outputParameters:
            - type: object
              mapping: "$."
