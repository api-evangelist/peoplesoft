naftiko: "1.0.0-alpha1"

info:
  label: "PeopleSoft Financials"
  description: "Financial Management APIs for general ledger, accounts payable, accounts receivable, expenses, asset management, and financial reporting."
  tags:
    - PeopleSoft
    - Financials
    - General Ledger
    - Accounts Payable
    - Accounts Receivable
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      PEOPLESOFT_USERNAME: PEOPLESOFT_USERNAME
      PEOPLESOFT_PASSWORD: PEOPLESOFT_PASSWORD

capability:
  consumes:
    - type: http
      namespace: financials
      baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/financials/v1
      description: "PeopleSoft Financials API"
      authentication:
        type: basic
        username: "{{PEOPLESOFT_USERNAME}}"
        password: "{{PEOPLESOFT_PASSWORD}}"
      resources:
        - name: general-ledger
          path: /gl
          description: "General ledger operations"
          operations:
            - name: list-journal-entries
              method: GET
              description: "Retrieve general ledger journal entries."
              inputParameters:
                - name: businessUnit
                  in: query
                  type: string
                  required: false
                  description: "Business unit filter"
                - name: fromDate
                  in: query
                  type: string
                  required: false
                  description: "Start date filter"
                - name: toDate
                  in: query
                  type: string
                  required: false
                  description: "End date filter"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: accounts-payable
          path: /ap
          description: "Accounts payable operations"
          operations:
            - name: list-vouchers
              method: GET
              description: "Retrieve accounts payable vouchers."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: accounts-receivable
          path: /ar
          description: "Accounts receivable operations"
          operations:
            - name: list-ar-items
              method: GET
              description: "Retrieve accounts receivable items."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: expenses
          path: /expenses
          description: "Expense management operations"
          operations:
            - name: list-expense-reports
              method: GET
              description: "Retrieve expense reports."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8108
      namespace: financials-api
      resources:
        - path: /v1/journal-entries
          name: journal-entries
          description: "General ledger journal entries"
          operations:
            - method: GET
              name: list-journal-entries
              description: "Retrieve general ledger journal entries."
              call: "financials.list-journal-entries"
              with:
                businessUnit: "rest.businessUnit"
                fromDate: "rest.fromDate"
                toDate: "rest.toDate"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/vouchers
          name: vouchers
          description: "Accounts payable vouchers"
          operations:
            - method: GET
              name: list-vouchers
              description: "Retrieve accounts payable vouchers."
              call: "financials.list-vouchers"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/receivable-items
          name: receivable-items
          description: "Accounts receivable items"
          operations:
            - method: GET
              name: list-ar-items
              description: "Retrieve accounts receivable items."
              call: "financials.list-ar-items"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/expense-reports
          name: expense-reports
          description: "Expense reports"
          operations:
            - method: GET
              name: list-expense-reports
              description: "Retrieve expense reports."
              call: "financials.list-expense-reports"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9108
      namespace: financials-mcp
      transport: http
      tools:
        - name: list-journal-entries
          description: "Retrieve general ledger journal entries."
          hints:
            readOnly: true
            openWorld: true
          call: "financials.list-journal-entries"
          with:
            businessUnit: "tools.businessUnit"
            fromDate: "tools.fromDate"
            toDate: "tools.toDate"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-vouchers
          description: "Retrieve accounts payable vouchers."
          hints:
            readOnly: true
            openWorld: true
          call: "financials.list-vouchers"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-ar-items
          description: "Retrieve accounts receivable items."
          hints:
            readOnly: true
            openWorld: true
          call: "financials.list-ar-items"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-expense-reports
          description: "Retrieve expense reports."
          hints:
            readOnly: true
            openWorld: true
          call: "financials.list-expense-reports"
          outputParameters:
            - type: object
              mapping: "$."
