naftiko: "1.0.0-alpha1"

info:
  label: "PeopleSoft Cloud Manager"
  description: "REST APIs for automated environment provisioning and deployment on Oracle Cloud Infrastructure including PeopleTools upgrades, update management, and self-service provisioning templates."
  tags:
    - PeopleSoft
    - Cloud Manager
    - Provisioning
    - Infrastructure
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      PEOPLESOFT_USERNAME: PEOPLESOFT_USERNAME
      PEOPLESOFT_PASSWORD: PEOPLESOFT_PASSWORD

capability:
  consumes:
    - type: http
      namespace: cloud-manager
      baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/cloudmgr/v1
      description: "PeopleSoft Cloud Manager API"
      authentication:
        type: basic
        username: "{{PEOPLESOFT_USERNAME}}"
        password: "{{PEOPLESOFT_PASSWORD}}"
      resources:
        - name: environments
          path: /environments
          description: "Environment provisioning and management"
          operations:
            - name: list-environments
              method: GET
              description: "Retrieve a list of provisioned PeopleSoft environments."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: provision-environment
              method: POST
              description: "Provision a new PeopleSoft environment on OCI from a template."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  templateId: "{{tools.templateId}}"
                  environmentName: "{{tools.environmentName}}"
                  configuration: "{{tools.configuration}}"
        - name: templates
          path: /templates
          description: "Provisioning template operations"
          operations:
            - name: list-templates
              method: GET
              description: "Retrieve available provisioning templates."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8104
      namespace: cloud-manager-api
      resources:
        - path: /v1/environments
          name: environments
          description: "PeopleSoft environments"
          operations:
            - method: GET
              name: list-environments
              description: "Retrieve provisioned environments."
              call: "cloud-manager.list-environments"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: provision-environment
              description: "Provision a new environment."
              call: "cloud-manager.provision-environment"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/templates
          name: templates
          description: "Provisioning templates"
          operations:
            - method: GET
              name: list-templates
              description: "Retrieve available provisioning templates."
              call: "cloud-manager.list-templates"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9104
      namespace: cloud-manager-mcp
      transport: http
      tools:
        - name: list-environments
          description: "Retrieve a list of provisioned PeopleSoft environments."
          hints:
            readOnly: true
            openWorld: true
          call: "cloud-manager.list-environments"
          outputParameters:
            - type: object
              mapping: "$."
        - name: provision-environment
          description: "Provision a new PeopleSoft environment on OCI from a template."
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "cloud-manager.provision-environment"
          with:
            templateId: "tools.templateId"
            environmentName: "tools.environmentName"
            configuration: "tools.configuration"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-templates
          description: "Retrieve available provisioning templates."
          hints:
            readOnly: true
            openWorld: true
          call: "cloud-manager.list-templates"
          outputParameters:
            - type: object
              mapping: "$."
