naftiko: "1.0.0-alpha1"

info:
  label: "PeopleSoft CRM"
  description: "Customer Relationship Management REST API endpoints and integration points for customer data, case management, sales, and marketing."
  tags:
    - PeopleSoft
    - CRM
    - Customer Management
    - Sales
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      PEOPLESOFT_USERNAME: PEOPLESOFT_USERNAME
      PEOPLESOFT_PASSWORD: PEOPLESOFT_PASSWORD

capability:
  consumes:
    - type: http
      namespace: crm
      baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/crm/v1
      description: "PeopleSoft CRM API"
      authentication:
        type: basic
        username: "{{PEOPLESOFT_USERNAME}}"
        password: "{{PEOPLESOFT_PASSWORD}}"
      resources:
        - name: customers
          path: /customers
          description: "Customer data operations"
          operations:
            - name: list-customers
              method: GET
              description: "Retrieve customer records."
              inputParameters:
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search term for customer name or ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-customer
              method: GET
              description: "Retrieve details for a specific customer."
              inputParameters:
                - name: customerId
                  in: path
                  type: string
                  required: true
                  description: "The customer identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: cases
          path: /cases
          description: "Case management operations"
          operations:
            - name: list-cases
              method: GET
              description: "Retrieve support and service cases."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-case
              method: POST
              description: "Create a new support or service case."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  case: "{{tools.case}}"
        - name: sales
          path: /sales
          description: "Sales operations"
          operations:
            - name: list-opportunities
              method: GET
              description: "Retrieve sales opportunities."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8106
      namespace: crm-api
      resources:
        - path: /v1/customers
          name: customers
          description: "Customer records"
          operations:
            - method: GET
              name: list-customers
              description: "Retrieve customer records."
              call: "crm.list-customers"
              with:
                search: "rest.search"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/customers/{customerId}
          name: customer-detail
          description: "Individual customer details"
          operations:
            - method: GET
              name: get-customer
              description: "Retrieve details for a specific customer."
              call: "crm.get-customer"
              with:
                customerId: "rest.customerId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/cases
          name: cases
          description: "Support and service cases"
          operations:
            - method: GET
              name: list-cases
              description: "Retrieve support and service cases."
              call: "crm.list-cases"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-case
              description: "Create a new support or service case."
              call: "crm.create-case"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/opportunities
          name: opportunities
          description: "Sales opportunities"
          operations:
            - method: GET
              name: list-opportunities
              description: "Retrieve sales opportunities."
              call: "crm.list-opportunities"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9106
      namespace: crm-mcp
      transport: http
      tools:
        - name: list-customers
          description: "Retrieve customer records."
          hints:
            readOnly: true
            openWorld: true
          call: "crm.list-customers"
          with:
            search: "tools.search"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-customer
          description: "Retrieve details for a specific customer."
          hints:
            readOnly: true
            openWorld: true
          call: "crm.get-customer"
          with:
            customerId: "tools.customerId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-cases
          description: "Retrieve support and service cases."
          hints:
            readOnly: true
            openWorld: true
          call: "crm.list-cases"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-case
          description: "Create a new support or service case."
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "crm.create-case"
          with:
            case: "tools.case"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-opportunities
          description: "Retrieve sales opportunities."
          hints:
            readOnly: true
            openWorld: true
          call: "crm.list-opportunities"
          outputParameters:
            - type: object
              mapping: "$."
