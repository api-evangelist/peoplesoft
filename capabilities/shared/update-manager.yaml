naftiko: "1.0.0-alpha1"

info:
  label: "PeopleSoft Update Manager"
  description: "REST services for automated update image management, change package generation, and PeopleSoft Automated Updates (PAU)."
  tags:
    - PeopleSoft
    - Update Manager
    - Patch Management
    - Lifecycle Management
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      PEOPLESOFT_USERNAME: PEOPLESOFT_USERNAME
      PEOPLESOFT_PASSWORD: PEOPLESOFT_PASSWORD

capability:
  consumes:
    - type: http
      namespace: update-manager
      baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/pum/v1
      description: "PeopleSoft Update Manager API"
      authentication:
        type: basic
        username: "{{PEOPLESOFT_USERNAME}}"
        password: "{{PEOPLESOFT_PASSWORD}}"
      resources:
        - name: updates
          path: /updates
          description: "Update and patch management operations"
          operations:
            - name: list-updates
              method: GET
              description: "Retrieve a list of available updates and change packages."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: apply-update
              method: POST
              description: "Initiate application of a specific update or change package."
              inputParameters:
                - name: updateId
                  in: path
                  type: string
                  required: true
                  description: "The update identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8120
      namespace: update-manager-api
      resources:
        - path: /v1/updates
          name: updates
          description: "Available updates"
          operations:
            - method: GET
              name: list-updates
              description: "Retrieve available updates and change packages."
              call: "update-manager.list-updates"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/updates/{updateId}/apply
          name: update-apply
          description: "Apply updates"
          operations:
            - method: POST
              name: apply-update
              description: "Initiate application of a specific update."
              call: "update-manager.apply-update"
              with:
                updateId: "rest.updateId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9120
      namespace: update-manager-mcp
      transport: http
      tools:
        - name: list-updates
          description: "Retrieve a list of available updates and change packages."
          hints:
            readOnly: true
            openWorld: true
          call: "update-manager.list-updates"
          outputParameters:
            - type: object
              mapping: "$."
        - name: apply-update
          description: "Initiate application of a specific update or change package."
          hints:
            readOnly: false
            destructive: true
            idempotent: false
          call: "update-manager.apply-update"
          with:
            updateId: "tools.updateId"
          outputParameters:
            - type: object
              mapping: "$."
