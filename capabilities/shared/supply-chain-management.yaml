naftiko: "1.0.0-alpha1"

info:
  label: "PeopleSoft Supply Chain Management"
  description: "REST API endpoints for procurement, inventory management, order fulfillment, logistics, and enterprise integration points for warehouse management systems."
  tags:
    - PeopleSoft
    - Supply Chain Management
    - Procurement
    - Inventory
    - Order Fulfillment
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      PEOPLESOFT_USERNAME: PEOPLESOFT_USERNAME
      PEOPLESOFT_PASSWORD: PEOPLESOFT_PASSWORD

capability:
  consumes:
    - type: http
      namespace: scm
      baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/scm/v1
      description: "PeopleSoft Supply Chain Management API"
      authentication:
        type: basic
        username: "{{PEOPLESOFT_USERNAME}}"
        password: "{{PEOPLESOFT_PASSWORD}}"
      resources:
        - name: procurement
          path: /procurement
          description: "Procurement and purchasing operations"
          operations:
            - name: list-requisitions
              method: GET
              description: "Retrieve procurement requisitions."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: list-purchase-orders
              method: GET
              description: "Retrieve purchase orders."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: inventory
          path: /inventory
          description: "Inventory management operations"
          operations:
            - name: list-inventory-items
              method: GET
              description: "Retrieve inventory items and stock levels."
              inputParameters:
                - name: businessUnit
                  in: query
                  type: string
                  required: false
                  description: "Business unit filter"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: orders
          path: /orders
          description: "Order fulfillment operations"
          operations:
            - name: list-orders
              method: GET
              description: "Retrieve order fulfillment records."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8119
      namespace: scm-api
      resources:
        - path: /v1/requisitions
          name: requisitions
          description: "Procurement requisitions"
          operations:
            - method: GET
              name: list-requisitions
              description: "Retrieve procurement requisitions."
              call: "scm.list-requisitions"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/purchase-orders
          name: purchase-orders
          description: "Purchase orders"
          operations:
            - method: GET
              name: list-purchase-orders
              description: "Retrieve purchase orders."
              call: "scm.list-purchase-orders"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/inventory-items
          name: inventory-items
          description: "Inventory items"
          operations:
            - method: GET
              name: list-inventory-items
              description: "Retrieve inventory items and stock levels."
              call: "scm.list-inventory-items"
              with:
                businessUnit: "rest.businessUnit"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/orders
          name: orders
          description: "Order fulfillment records"
          operations:
            - method: GET
              name: list-orders
              description: "Retrieve order fulfillment records."
              call: "scm.list-orders"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9119
      namespace: scm-mcp
      transport: http
      tools:
        - name: list-requisitions
          description: "Retrieve procurement requisitions."
          hints:
            readOnly: true
            openWorld: true
          call: "scm.list-requisitions"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-purchase-orders
          description: "Retrieve purchase orders."
          hints:
            readOnly: true
            openWorld: true
          call: "scm.list-purchase-orders"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-inventory-items
          description: "Retrieve inventory items and stock levels."
          hints:
            readOnly: true
            openWorld: true
          call: "scm.list-inventory-items"
          with:
            businessUnit: "tools.businessUnit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-orders
          description: "Retrieve order fulfillment records."
          hints:
            readOnly: true
            openWorld: true
          call: "scm.list-orders"
          outputParameters:
            - type: object
              mapping: "$."
