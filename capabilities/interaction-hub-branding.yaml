naftiko: 1.0.0-alpha2
info:
  label: PeopleSoft Interaction Hub API — Branding
  description: 'PeopleSoft Interaction Hub API — Branding. 1 operations. Lead operation: PeopleSoft List Themes. Self-contained
    Naftiko capability covering one Peoplesoft business surface.'
  tags:
  - Peoplesoft
  - Branding
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PEOPLESOFT_API_KEY: PEOPLESOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: interaction-hub-branding
    baseUri: https://{hostname}:{port}/psft/api/hub/v1
    description: PeopleSoft Interaction Hub API — Branding business capability. Self-contained, no shared references.
    resources:
    - name: branding-themes
      path: /branding/themes
      operations:
      - name: listthemes
        method: GET
        description: PeopleSoft List Themes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.PEOPLESOFT_USER}}'
      password: '{{env.PEOPLESOFT_PASS}}'
  exposes:
  - type: rest
    namespace: interaction-hub-branding-rest
    port: 8080
    description: REST adapter for PeopleSoft Interaction Hub API — Branding. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/branding/themes
      name: branding-themes
      description: REST surface for branding-themes.
      operations:
      - method: GET
        name: listthemes
        description: PeopleSoft List Themes
        call: interaction-hub-branding.listthemes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: interaction-hub-branding-mcp
    port: 9090
    transport: http
    description: MCP adapter for PeopleSoft Interaction Hub API — Branding. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: peoplesoft-list-themes
      description: PeopleSoft List Themes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: interaction-hub-branding.listthemes
      outputParameters:
      - type: object
        mapping: $.
