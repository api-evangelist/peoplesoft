naftiko: 1.0.0-alpha2
info:
  label: PeopleSoft Finance And Accounting
  description: Unified workflow for finance controllers combining general ledger, accounts payable, accounts receivable, expenses,
    budgeting, forecasting, analytics, and approval workflows across PeopleSoft Financials, EPM, and Approval Workflow Engine
    APIs.
  tags:
  - PeopleSoft
  - Finance
  - Accounting
  - General Ledger
  - Budgeting
  - Forecasting
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    PEOPLESOFT_USERNAME: PEOPLESOFT_USERNAME
    PEOPLESOFT_PASSWORD: PEOPLESOFT_PASSWORD
capability:
  consumes:
  - type: http
    namespace: financials
    baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/financials/v1
    description: PeopleSoft Financials API
    authentication:
      type: basic
      username: '{{PEOPLESOFT_USERNAME}}'
      password: '{{PEOPLESOFT_PASSWORD}}'
    resources:
    - name: general-ledger
      path: /gl
      description: General ledger operations
      operations:
      - name: list-journal-entries
        method: GET
        description: Retrieve general ledger journal entries.
        inputParameters:
        - name: businessUnit
          in: query
          type: string
          required: false
          description: Business unit filter
        - name: fromDate
          in: query
          type: string
          required: false
          description: Start date filter
        - name: toDate
          in: query
          type: string
          required: false
          description: End date filter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: accounts-payable
      path: /ap
      description: Accounts payable operations
      operations:
      - name: list-vouchers
        method: GET
        description: Retrieve accounts payable vouchers.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: accounts-receivable
      path: /ar
      description: Accounts receivable operations
      operations:
      - name: list-ar-items
        method: GET
        description: Retrieve accounts receivable items.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: expenses
      path: /expenses
      description: Expense management operations
      operations:
      - name: list-expense-reports
        method: GET
        description: Retrieve expense reports.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: epm
    baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/epm/v1
    description: PeopleSoft Enterprise Performance Management API
    authentication:
      type: basic
      username: '{{PEOPLESOFT_USERNAME}}'
      password: '{{PEOPLESOFT_PASSWORD}}'
    resources:
    - name: budgets
      path: /budgets
      description: Budget management operations
      operations:
      - name: list-budgets
        method: GET
        description: Retrieve budget definitions and data.
        inputParameters:
        - name: fiscalYear
          in: query
          type: string
          required: false
          description: Fiscal year filter
        - name: businessUnit
          in: query
          type: string
          required: false
          description: Business unit filter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: forecasts
      path: /forecasts
      description: Forecasting operations
      operations:
      - name: list-forecasts
        method: GET
        description: Retrieve forecast data and projections.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: analytics
      path: /analytics
      description: Analytics and reporting operations
      operations:
      - name: list-analytics-reports
        method: GET
        description: Retrieve performance analytics reports.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: approval-workflow
    baseUri: https://${PEOPLESOFT_HOST}:${PEOPLESOFT_PORT}/psft/api/approvals/v1
    description: PeopleSoft Approval Workflow Engine API
    authentication:
      type: basic
      username: '{{PEOPLESOFT_USERNAME}}'
      password: '{{PEOPLESOFT_PASSWORD}}'
    resources:
    - name: approvals
      path: /approvals
      description: Approval workflow operations
      operations:
      - name: list-pending-approvals
        method: GET
        description: Retrieve a list of pending approval requests for the current user.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: process-approval
        method: PUT
        description: Approve, deny, or push back an approval request.
        inputParameters:
        - name: approvalId
          in: path
          type: string
          required: true
          description: The approval request identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            action: '{{tools.action}}'
            comments: '{{tools.comments}}'
  exposes:
  - type: rest
    port: 8081
    namespace: finance-api
    description: Unified REST API for PeopleSoft finance and accounting workflows.
    resources:
    - path: /v1/journal-entries
      name: journal-entries
      description: General ledger journal entries
      operations:
      - method: GET
        name: list-journal-entries
        description: Retrieve general ledger journal entries.
        call: financials.list-journal-entries
        with:
          businessUnit: rest.businessUnit
          fromDate: rest.fromDate
          toDate: rest.toDate
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/vouchers
      name: vouchers
      description: Accounts payable vouchers
      operations:
      - method: GET
        name: list-vouchers
        description: Retrieve accounts payable vouchers.
        call: financials.list-vouchers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/receivable-items
      name: receivable-items
      description: Accounts receivable items
      operations:
      - method: GET
        name: list-ar-items
        description: Retrieve accounts receivable items.
        call: financials.list-ar-items
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/expense-reports
      name: expense-reports
      description: Expense reports
      operations:
      - method: GET
        name: list-expense-reports
        description: Retrieve expense reports.
        call: financials.list-expense-reports
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/budgets
      name: budgets
      description: Budget definitions and data
      operations:
      - method: GET
        name: list-budgets
        description: Retrieve budget definitions and data.
        call: epm.list-budgets
        with:
          fiscalYear: rest.fiscalYear
          businessUnit: rest.businessUnit
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/forecasts
      name: forecasts
      description: Forecast data and projections
      operations:
      - method: GET
        name: list-forecasts
        description: Retrieve forecast data and projections.
        call: epm.list-forecasts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/analytics-reports
      name: analytics-reports
      description: Performance analytics reports
      operations:
      - method: GET
        name: list-analytics-reports
        description: Retrieve performance analytics reports.
        call: epm.list-analytics-reports
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/approvals
      name: approvals
      description: Finance approval requests
      operations:
      - method: GET
        name: list-pending-approvals
        description: Retrieve pending finance approval requests.
        call: approval-workflow.list-pending-approvals
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/approvals/{approvalId}
      name: approval-detail
      description: Individual approval operations
      operations:
      - method: PUT
        name: process-approval
        description: Approve, deny, or push back a finance approval request.
        call: approval-workflow.process-approval
        with:
          approvalId: rest.approvalId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9091
    namespace: finance-mcp
    transport: http
    description: MCP server for AI-assisted PeopleSoft finance and accounting workflows.
    tools:
    - name: list-journal-entries
      description: Retrieve general ledger journal entries.
      hints:
        readOnly: true
        openWorld: true
      call: financials.list-journal-entries
      with:
        businessUnit: tools.businessUnit
        fromDate: tools.fromDate
        toDate: tools.toDate
      outputParameters:
      - type: object
        mapping: $.
    - name: list-vouchers
      description: Retrieve accounts payable vouchers.
      hints:
        readOnly: true
        openWorld: true
      call: financials.list-vouchers
      outputParameters:
      - type: object
        mapping: $.
    - name: list-ar-items
      description: Retrieve accounts receivable items.
      hints:
        readOnly: true
        openWorld: true
      call: financials.list-ar-items
      outputParameters:
      - type: object
        mapping: $.
    - name: list-expense-reports
      description: Retrieve expense reports.
      hints:
        readOnly: true
        openWorld: true
      call: financials.list-expense-reports
      outputParameters:
      - type: object
        mapping: $.
    - name: list-budgets
      description: Retrieve budget definitions and data.
      hints:
        readOnly: true
        openWorld: true
      call: epm.list-budgets
      with:
        fiscalYear: tools.fiscalYear
        businessUnit: tools.businessUnit
      outputParameters:
      - type: object
        mapping: $.
    - name: list-forecasts
      description: Retrieve forecast data and projections.
      hints:
        readOnly: true
        openWorld: true
      call: epm.list-forecasts
      outputParameters:
      - type: object
        mapping: $.
    - name: list-analytics-reports
      description: Retrieve performance analytics reports.
      hints:
        readOnly: true
        openWorld: true
      call: epm.list-analytics-reports
      outputParameters:
      - type: object
        mapping: $.
    - name: list-pending-approvals
      description: Retrieve pending finance approval requests.
      hints:
        readOnly: true
        openWorld: true
      call: approval-workflow.list-pending-approvals
      outputParameters:
      - type: object
        mapping: $.
    - name: process-approval
      description: Approve, deny, or push back a finance approval request.
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: approval-workflow.process-approval
      with:
        approvalId: tools.approvalId
        action: tools.action
        comments: tools.comments
      outputParameters:
      - type: object
        mapping: $.
