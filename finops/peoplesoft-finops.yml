    unit: credit
    aggregation: sum
    dimensions:
      - tenancy
      - region
principles:
  - name: Visibility
    description: Visibility comes from Oracle CSI-level invoices, the License Management
      Service (LMS) audit trail, and OCI billing for hosted deployments — there is no PeopleSoft-native
      cost API.
  - name: Allocation
    description: Allocate by module (HCM / Financials / SCM / CRM / Campus Solutions) and
      by environment (prod / non-prod); apportion named-user licenses to business units.
  - name: Optimization
    description: Optimize by retiring unused named-user licenses at renewal, consolidating
      to processor licensing where user counts grow, and tuning PeopleTools batch / IB workloads
      to reduce OCI credit burn.
  - name: Accountability
    description: ERP system owner / CIO accountable for the Oracle contract; module owners
      accountable for license-utilization at renewal.
