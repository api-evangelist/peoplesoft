  - name: processor_licenses
    description: Processor-metric licenses for unlimited-user deployments
    unit: processor-year
    aggregation: max
    dimensions:
      - module
      - server
  - name: annual_support
    description: Oracle annual support / maintenance fee
    unit: year
    aggregation: count
    dimensions:
